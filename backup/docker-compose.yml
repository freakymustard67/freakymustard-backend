services:
  english:
    build: .
    container_name: freaky-backup-english
    command: ["node", "server.js", "--config", "config/english.json"]
    ports: ["8101:8101"]
    restart: unless-stopped

  tamil:
    build: .
    container_name: freaky-backup-tamil
    command: ["node", "server.js", "--config", "config/tamil.json"]
    ports: ["8102:8102"]
    restart: unless-stopped
